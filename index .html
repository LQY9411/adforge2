<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdForge — AI 广告文案生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #1e1e20;
  --bg-side:  #242426;
  --bg2:      #2a2a2c;
  --bg3:      #323234;
  --bg-input: #2e2e30;
  --text:     #f0f0eb;
  --text2:    #9a9a9e;
  --text3:    #5e5e62;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --accent:   #f0f0eb;
  --success:  #4ade80;
  --danger:   #f87171;
  --danger-bg:#3b1212;
  --danger-bd:rgba(248,113,113,0.25);
  --trans-bg: rgba(255,255,255,0.04);
  --trans-bd: rgba(255,255,255,0.1);
  --trans-tx: #8ab4d4;
  --info-bg:  rgba(96,184,232,0.12);
  --info-tx:  #60b8e8;
  --radius:   8px;
  --radius-lg:12px;
}
body { font-family:'DM Sans',-apple-system,sans-serif; font-size:15px; background:var(--bg); color:var(--text); min-height:100vh; }

/* ── HEADER ── */
.header {
  padding:.7rem 1.5rem;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg-side);
  position:sticky; top:0; z-index:10; gap:12px;
}
.logo {
  font-family:'Bebas Neue',sans-serif;
  font-size:28px; letter-spacing:3px;
  color:var(--text);
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  line-height:1; padding-top:2px;
}
.badge {
  font-family:'DM Sans',sans-serif; font-size:9px; font-weight:600;
  background:var(--info-bg); color:var(--info-tx);
  padding:2px 7px; border-radius:20px; letter-spacing:.7px;
  text-transform:uppercase; margin-top:3px;
}
.model-sw { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text2); }
.model-sw select {
  font-family:'DM Sans',sans-serif; font-size:13px; padding:5px 10px;
  border:1px solid var(--border2); border-radius:var(--radius);
  background:var(--bg3); color:var(--text); cursor:pointer;
}
.model-sw select:focus { outline:none; }

/* ── LAYOUT ── */
.main { display:grid; grid-template-columns:330px 1fr; min-height:calc(100vh - 50px); }
.sidebar {
  border-right:1px solid var(--border);
  padding:1.1rem; display:flex; flex-direction:column; gap:.85rem;
  overflow-y:auto; background:var(--bg-side);
}
.content { padding:1.4rem; background:var(--bg2); overflow-y:auto; }

/* ── FORM ELEMENTS ── */
.slabel {
  font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:1.3px; text-transform:uppercase; color:var(--text3);
  margin-bottom:6px;
}
.fg { display:flex; flex-direction:column; gap:4px; }
.fg label { font-size:13px; font-weight:500; color:var(--text2); }
.fg input, .fg textarea, .fg select {
  font-family:'DM Sans',sans-serif; font-size:13.5px; padding:7px 10px;
  border:1px solid var(--border2); border-radius:var(--radius);
  background:var(--bg-input); color:var(--text); width:100%;
}
.fg input:focus,.fg textarea:focus,.fg select:focus { outline:none; border-color:rgba(255,255,255,0.3); }
.fg textarea { resize:vertical; min-height:62px; line-height:1.5; }
.fg input::placeholder,.fg textarea::placeholder { color:var(--text3); }
.divider { height:1px; background:var(--border); flex-shrink:0; }

/* ── PILLS ── */
.pills { display:flex; flex-wrap:wrap; gap:5px; }
.pill {
  font-size:12.5px; font-weight:500; padding:5px 12px; border-radius:20px;
  border:1px solid var(--border2); background:transparent; color:var(--text2);
  cursor:pointer; transition:all .12s; font-family:'DM Sans',sans-serif; user-select:none;
}
.pill:hover { border-color:rgba(255,255,255,0.3); color:var(--text); }
.pill.on { background:var(--text); color:#1a1a1a; border-color:var(--text); font-weight:600; }

/* ── USP TAGS ── */
.utags { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
.utag {
  font-size:12px; padding:4px 10px; border-radius:20px;
  border:1px dashed var(--border2); background:transparent; color:var(--text2);
  cursor:pointer; transition:all .12s; font-family:'DM Sans',sans-serif; user-select:none;
}
.utag:hover { border-style:solid; color:var(--text); }
.utag.on { border-style:solid; border-color:rgba(255,255,255,0.35); background:var(--bg3); color:var(--text); }

/* ── PLATFORM ── */
.pgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.ppill {
  font-size:13px; font-weight:600; padding:8px 6px; border-radius:var(--radius);
  border:1px solid var(--border2); background:transparent; color:var(--text2);
  cursor:pointer; transition:all .12s; font-family:'DM Sans',sans-serif;
  text-align:center; user-select:none;
}
.ppill:hover { border-color:rgba(255,255,255,0.3); color:var(--text); }
.ppill.m { background:#1877F2; color:#fff; border-color:#1877F2; }
.ppill.g { background:#EA4335; color:#fff; border-color:#EA4335; }
.ppill.t { background:#2a2a2a; color:#fff; border-color:#555; }

/* ── AGE ROW ── */
.age-row { display:flex; align-items:center; gap:6px; }
.age-row span { font-size:13px; color:var(--text2); white-space:nowrap; }
.age-row select { flex:1; }

/* ── GENERATE BTN ── */
.gbtn {
  width:100%; padding:11px; font-family:'Syne',sans-serif; font-size:14px; font-weight:700;
  letter-spacing:.4px; border-radius:var(--radius); border:none;
  background:var(--text); color:#1a1a1a;
  cursor:pointer; transition:opacity .15s,transform .1s;
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-top:auto; flex-shrink:0;
}
.gbtn:hover { opacity:.88; }
.gbtn:active { transform:scale(.98); }
.gbtn:disabled { opacity:.3; cursor:not-allowed; transform:none; }

/* ── SPINNERS ── */
.spin  { width:15px; height:15px; border-radius:50%; border:2px solid rgba(0,0,0,.2); border-top-color:#1a1a1a; animation:sp .7s linear infinite; flex-shrink:0; }
.spin2 { width:17px; height:17px; border-radius:50%; border:2px solid var(--border2); border-top-color:var(--text); animation:sp .7s linear infinite; flex-shrink:0; }
@keyframes sp { to { transform:rotate(360deg); } }

/* ── BATCH BADGE ── */
.batch-badge {
  font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px;
  background:rgba(255,255,255,0.1); color:var(--text2);
  border:1px solid var(--border2); letter-spacing:.3px;
}

/* ── EMPTY STATE ── */
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:420px; gap:13px; text-align:center; padding:2rem; }
.empty-wordmark { font-family:'Bebas Neue',sans-serif; font-size:56px; letter-spacing:5px; color:rgba(255,255,255,0.07); line-height:1; }
.empty h3 { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; color:var(--text); }
.empty p { font-size:13.5px; line-height:1.65; max-width:260px; color:var(--text2); }

/* ── RESULTS ── */
.rhead { display:flex; align-items:center; gap:9px; margin-bottom:1rem; flex-wrap:wrap; }
.rtitle { font-family:'Syne',sans-serif; font-size:10.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:1.1px; }
.lbadge { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--border2); color:var(--text2); }
.cabtn {
  font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:500; padding:5px 12px;
  border-radius:var(--radius); border:1px solid var(--border2);
  background:transparent; color:var(--text2); cursor:pointer;
  display:flex; align-items:center; gap:5px; margin-left:auto; transition:all .12s;
}
.cabtn:hover { background:var(--bg3); color:var(--text); }

/* ── PLATFORM CARD ── */
.rgrid { display:flex; flex-direction:column; gap:1rem; }
.pcard { background:var(--bg-side); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
.phead { padding:10px 15px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:9px; }
.pdot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dm{background:#1877F2} .dg{background:#EA4335} .dt{background:#aaa}
.pname { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; color:var(--text); }
.psub { font-size:11px; color:var(--text3); margin-left:auto; }

/* ── COPY FIELDS ── */
.fgrid { padding:12px 15px; display:flex; flex-direction:column; gap:10px; }
.cfield { display:flex; flex-direction:column; gap:4px; }
.frow { display:flex; align-items:center; justify-content:space-between; }
.fname { font-size:10.5px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.9px; }
.fcount { font-size:10.5px; color:var(--text3); }
.fover { color:var(--danger); }
.fcontent {
  font-size:13.5px; line-height:1.6; padding:8px 11px;
  background:var(--bg2); border-radius:var(--radius);
  border:1px solid var(--border); white-space:pre-wrap;
  word-break:break-word; min-height:34px; outline:none; color:var(--text);
}
.fcontent:focus { border-color:var(--border2); }
.trans-block { padding:7px 11px; background:var(--trans-bg); border:1px solid var(--trans-bd); border-radius:var(--radius); }
.trans-label { font-size:9.5px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--trans-tx); opacity:.7; margin-bottom:2px; }
.trans-text { font-size:13px; line-height:1.6; color:var(--trans-tx); }
.cacts { display:flex; justify-content:flex-end; gap:5px; }
.cbtn {
  font-size:12px; font-family:'DM Sans',sans-serif; font-weight:500; padding:4px 10px;
  border-radius:var(--radius); border:1px solid var(--border2);
  background:transparent; color:var(--text2); cursor:pointer; transition:all .12s;
}
.cbtn:hover { background:var(--bg3); color:var(--text); }
.cbtn.copied { color:var(--success); border-color:var(--success); }
.fsep { height:1px; background:var(--border); margin:1px 0; }

/* ── LOADING / ERROR ── */
.lcards { display:flex; flex-direction:column; gap:10px; }
.lcard { background:var(--bg-side); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; display:flex; align-items:center; gap:12px; }
.ltext { font-size:13.5px; color:var(--text2); }
.errbar { background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-bd); border-radius:var(--radius); padding:12px 15px; font-size:13.5px; line-height:1.6; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">⚒ AdForge <span class="badge">Beta</span></div>
  <div class="model-sw">
    <span>模型</span>
    <select id="model-select">
      <option value="qwen">千问 Qwen-Plus（推荐）</option>
      <option value="deepseek">DeepSeek</option>
    </select>
  </div>
</header>

<div class="main">
  <div class="sidebar">

    <div>
      <div class="slabel">产品信息</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="fg"><label>产品名称</label><input type="text" id="pname" placeholder="e.g. LoveSpark"/></div>
        <div class="fg">
          <label>核心卖点</label>
          <textarea id="kpoints" placeholder="手动输入，或点击下方快速选择"></textarea>
          <div class="utags" id="utags">
            <button class="utag" data-v="AI-powered smart matching">AI 智能匹配</button>
            <button class="utag" data-v="verified real profiles only">真实认证用户</button>
            <button class="utag" data-v="millions of active users worldwide">全球百万用户</button>
            <button class="utag" data-v="privacy & safety first">隐私安全保障</button>
            <button class="utag" data-v="free to download & sign up">免费下载注册</button>
            <button class="utag" data-v="video chat & voice calls">视频/语音通话</button>
            <button class="utag" data-v="location-based nearby matching">附近的人匹配</button>
            <button class="utag" data-v="deep personality compatibility">深度性格匹配</button>
            <button class="utag" data-v="zero bots, real humans only">无机器人骚扰</button>
            <button class="utag" data-v="premium recommendation algorithm">顶级算法推荐</button>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="slabel">目标受众</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="fg">
          <label>性别</label>
          <div class="pills" id="gender-g">
            <button class="pill on" data-v="male">男性</button>
            <button class="pill" data-v="female">女性</button>
            <button class="pill" data-v="all">不限</button>
          </div>
        </div>
        <div class="fg">
          <label>年龄段</label>
          <div class="age-row">
            <span>从</span>
            <select id="amin"><option>18</option><option>21</option><option selected>25</option><option>28</option><option>30</option><option>35</option><option>40</option><option>45</option></select>
            <span>岁到</span>
            <select id="amax"><option>25</option><option>30</option><option selected>35</option><option>40</option><option>45</option><option>50</option><option>55</option><option>65+</option></select>
            <span>岁</span>
          </div>
        </div>
        <div class="fg"><label>其他特征（可选）</label><input type="text" id="textra" placeholder="e.g. 都市白领、有正式交往意向"/></div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="slabel">语气风格</div>
      <div class="pills" id="tone-g">
        <button class="pill on" data-v="romantic">Romantic</button>
        <button class="pill" data-v="flirty">Flirty</button>
        <button class="pill" data-v="bold">Bold &amp; Direct</button>
        <button class="pill" data-v="playful">Playful</button>
        <button class="pill" data-v="emotional">Emotional</button>
        <button class="pill" data-v="empowering">Empowering</button>
        <button class="pill" data-v="mysterious">Mysterious</button>
        <button class="pill" data-v="premium">Luxury</button>
        <button class="pill" data-v="urgent">Urgency</button>
        <button class="pill" data-v="humorous">Humorous</button>
        <button class="pill" data-v="authentic">Authentic</button>
        <button class="pill" data-v="sensual">Sensual</button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="slabel">输出语言</div>
      <div class="pills" id="lang-g">
        <button class="pill on" data-v="en">English</button>
        <button class="pill" data-v="es">Español</button>
        <button class="pill" data-v="pt">Português</button>
        <button class="pill" data-v="zh">中文</button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="slabel">投放平台</div>
      <div class="pgrid">
        <button class="ppill m" id="plt-meta"   onclick="toggleP('meta')">Meta</button>
        <button class="ppill"   id="plt-google" onclick="toggleP('google')">Google</button>
        <button class="ppill"   id="plt-tiktok" onclick="toggleP('tiktok')">TikTok</button>
      </div>
    </div>

    <button class="gbtn" id="gbtn" onclick="gen()">✦ 一键生成文案</button>

  </div><!-- /sidebar -->

  <div class="content">
    <div class="empty" id="empty">
      <div class="empty-wordmark">ADFORGE</div>
      <h3>填写左侧信息，开始生成</h3>
      <p>AI 生成适配各平台规范的广告文案。非中文输出时自动附带中文翻译，每个字段可单独复制。</p>
    </div>
    <div id="rarea" style="display:none">
      <div class="rhead">
        <span class="rtitle">生成结果</span>
        <span class="lbadge" id="lbadge">English</span>
        <span class="batch-badge" id="batch-badge">第 1 批</span>
        <button class="cabtn" onclick="copyAll()">⎘ 复制全部</button>
      </div>
      <div class="rgrid" id="rgrid"></div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://adforge.qy299792.workers.dev";

// ── STATE ──
// 默认：性别=男性，平台=仅Meta，批次计数用于强制生成差异
const S = { tone:'romantic', lang:'en', gender:'male', plt:{meta:true,google:false,tiktok:false} };
const usps = new Set();
let batchCount = 0; // 每次点生成递增，传入prompt让AI生成不同内容

// ── COPY MAPS ──
const toneMap = {
  romantic:   'warm, romantic and deeply emotionally resonant — evoke butterflies, longing, the feeling of finding "the one"',
  flirty:     'flirty, cheeky and playfully suggestive — light teasing energy, winking undertones, makes the reader smile and feel seen',
  bold:       'bold, blunt and unapologetically direct — no fluff, calls out the desire head-on, confident tone',
  playful:    'fun, witty and lighthearted — pop culture vibes, self-aware humor, Gen Z/Millennial energy',
  emotional:  'emotionally vulnerable and honest — speaks to loneliness, desire for genuine connection, heartfelt and relatable',
  empowering: 'empowering and confidence-boosting — "you deserve this", self-worth framing, aspirational without being cheesy',
  mysterious: 'mysterious and intriguing — creates curiosity, open loops and teaser language, leaves them wanting more',
  premium:    'luxury and exclusive — premium positioning, high-status social proof, aspirational lifestyle framing',
  urgent:     'high urgency and FOMO-driven — scarcity signals, "don\'t miss out", time-sensitive action triggers',
  humorous:   'genuinely funny and self-deprecating — relatable dating fails, absurdist humor, laughing at modern dating struggles',
  authentic:  'authentic and no-BS — real talk, conversational, zero corporate speak, like advice from a trusted friend',
  sensual:    'subtly sensual and desire-forward — tasteful but charged with attraction energy, grown and sexy'
};
const langMap = {
  en:{ name:'English',   inst:'Write ALL copy in English only.' },
  es:{ name:'Español',   inst:'Write ALL copy in Spanish (Latin American) only.' },
  pt:{ name:'Português', inst:'Write ALL copy in Brazilian Portuguese only.' },
  zh:{ name:'中文',       inst:'Write ALL copy in Simplified Chinese only.' }
};
const gMap = { male:'heterosexual men', female:'heterosexual women', all:'all singles' };

// ── PLATFORM FIELD DEFINITIONS ──
const pFmt = {
  meta:{ name:'Meta (Facebook / Instagram)', dc:'dm', fields:[
    {k:'headline1',     l:'Headline 1',     lim:40},
    {k:'headline2',     l:'Headline 2',     lim:40},
    {k:'headline3',     l:'Headline 3',     lim:40},
    {k:'primary_text1', l:'Primary Text 1', lim:125},
    {k:'primary_text2', l:'Primary Text 2', lim:125},
    {k:'primary_text3', l:'Primary Text 3', lim:125},
    {k:'cta',           l:'CTA Button',     lim:20}
  ]},
  google:{ name:'Google Ads (RSA)', dc:'dg', fields:[
    {k:'headline1',    l:'Headline 1',    lim:30},
    {k:'headline2',    l:'Headline 2',    lim:30},
    {k:'headline3',    l:'Headline 3',    lim:30},
    {k:'headline4',    l:'Headline 4',    lim:30},
    {k:'headline5',    l:'Headline 5',    lim:30},
    {k:'description1', l:'Description 1', lim:90},
    {k:'description2', l:'Description 2', lim:90},
    {k:'description3', l:'Description 3', lim:90},
    {k:'description4', l:'Description 4', lim:90},
    {k:'description5', l:'Description 5', lim:90}
  ]},
  tiktok:{ name:'TikTok Ads', dc:'dt', fields:[
    {k:'hook1',    l:'Video Hook 1 (0–3s)', lim:50},
    {k:'hook2',    l:'Video Hook 2 (0–3s)', lim:50},
    {k:'hook3',    l:'Video Hook 3 (0–3s)', lim:50},
    {k:'ad_text1', l:'Ad Text 1',           lim:100},
    {k:'ad_text2', l:'Ad Text 2',           lim:100},
    {k:'ad_text3', l:'Ad Text 3',           lim:100},
    {k:'cta',      l:'CTA',                 lim:20},
    {k:'hashtags', l:'Hashtags',            lim:80}
  ]}
};

let gdata = {};
const needsTrans = () => S.lang !== 'zh';

// ── PILL SETUP ──
function setupGroup(id, key) {
  document.getElementById(id).querySelectorAll('.pill').forEach(b => {
    b.addEventListener('click', function() {
      S[key] = this.dataset.v;
      document.getElementById(id).querySelectorAll('.pill').forEach(x => x.classList.remove('on'));
      this.classList.add('on');
      if (key === 'lang') document.getElementById('lbadge').textContent = langMap[S.lang].name;
    });
  });
}
setupGroup('tone-g','tone');
setupGroup('lang-g','lang');
setupGroup('gender-g','gender');

// ── USP TAGS ──
document.getElementById('utags').querySelectorAll('.utag').forEach(b => {
  b.addEventListener('click', function() {
    const v = this.dataset.v;
    if (usps.has(v)) { usps.delete(v); this.classList.remove('on'); }
    else { usps.add(v); this.classList.add('on'); }
    const ta = document.getElementById('kpoints');
    const manual = ta.value.split('\n').filter(l => ![...usps,v].some(u => l.trim()===u)).join('\n').trim();
    ta.value = [manual, [...usps].join(', ')].filter(Boolean).join('\n');
  });
});

// ── PLATFORM TOGGLE ──
function toggleP(p) {
  S.plt[p] = !S.plt[p];
  const b = document.getElementById('plt-'+p);
  const cls = {meta:'m',google:'g',tiktok:'t'}[p];
  S.plt[p] ? b.classList.add(cls) : b.classList.remove(cls);
}

// ── BUILD PROMPT ──
function buildPrompt() {
  const name   = document.getElementById('pname').value.trim()   || 'our dating app';
  const pts    = document.getElementById('kpoints').value.trim() || 'smart matching, safe community';
  const extra  = document.getElementById('textra').value.trim();
  const amin   = document.getElementById('amin').value;
  const amax   = document.getElementById('amax').value;
  const aud    = `${gMap[S.gender]}, ages ${amin}-${amax}${extra?', '+extra:''}`;
  const active = Object.entries(S.plt).filter(([,v])=>v).map(([k])=>k);
  const wt     = needsTrans();
  const zt     = k => wt ? `, "${k}_zh": "[Chinese translation]"` : '';

  // batchCount ensures each regeneration gets different copy
  const batchNote = batchCount > 1
    ? `\nBATCH #${batchCount}: This is regeneration #${batchCount}. You MUST produce completely fresh copy — different words, different angles, different emotional hooks than any previous batch. Do not repeat any phrases from earlier generations.`
    : '';

  const specs = {
    meta: `"meta": {
    "headline1": "[MAX 40 CHARS]"${zt('headline1')},
    "headline2": "[MAX 40 CHARS — different angle]"${zt('headline2')},
    "headline3": "[MAX 40 CHARS — different angle]"${zt('headline3')},
    "primary_text1": "[MAX 125 CHARS]"${zt('primary_text1')},
    "primary_text2": "[MAX 125 CHARS — different emotional angle]"${zt('primary_text2')},
    "primary_text3": "[MAX 125 CHARS — different emotional angle]"${zt('primary_text3')},
    "cta": "[MAX 20 CHARS]"${zt('cta')}
  }`,
    google: `"google": {
    "headline1": "[MAX 30 CHARS ~4 words]"${zt('headline1')},
    "headline2": "[MAX 30 CHARS ~4 words]"${zt('headline2')},
    "headline3": "[MAX 30 CHARS ~4 words]"${zt('headline3')},
    "headline4": "[MAX 30 CHARS ~4 words]"${zt('headline4')},
    "headline5": "[MAX 30 CHARS ~4 words]"${zt('headline5')},
    "description1": "[MAX 90 CHARS]"${zt('description1')},
    "description2": "[MAX 90 CHARS]"${zt('description2')},
    "description3": "[MAX 90 CHARS]"${zt('description3')},
    "description4": "[MAX 90 CHARS]"${zt('description4')},
    "description5": "[MAX 90 CHARS]"${zt('description5')}
  }`,
    tiktok: `"tiktok": {
    "hook1": "[MAX 50 CHARS scroll-stop opener]"${zt('hook1')},
    "hook2": "[MAX 50 CHARS — completely different style]"${zt('hook2')},
    "hook3": "[MAX 50 CHARS — completely different style]"${zt('hook3')},
    "ad_text1": "[MAX 100 CHARS casual caption]"${zt('ad_text1')},
    "ad_text2": "[MAX 100 CHARS — different vibe]"${zt('ad_text2')},
    "ad_text3": "[MAX 100 CHARS — different vibe]"${zt('ad_text3')},
    "cta": "[MAX 20 CHARS]"${zt('cta')},
    "hashtags": "[MAX 80 CHARS total with # symbols]"${zt('hashtags')}
  }`
  };

  const toneEx = {
    romantic:   '"The one you\'ve been waiting for" / "Every love story needs a first message"',
    flirty:     '"Go on, take a look" / "They\'ve been waiting for you to show up"',
    bold:       '"Stop swiping. Start dating." / "Real dates. No games."',
    playful:    '"Your future ex is on this app" / "POV: you finally downloaded it"',
    emotional:  '"You deserve more than situationships" / "Still eating dinner alone?"',
    empowering: '"You deserve someone who chooses you" / "Stop settling."',
    mysterious: '"Someone nearby is looking for you" / "Don\'t open this if you\'re happy single"',
    premium:    '"Where quality singles actually meet" / "Not your average dating app."',
    urgent:     '"1,000 singles joined this week" / "They found someone. Why haven\'t you?"',
    humorous:   '"Your mom asked if you\'re seeing anyone" / "My therapist said try dating apps so"',
    authentic:  '"Real people. Actual conversations." / "No bots. No BS."',
    sensual:    '"Chemistry you can actually feel" / "Some connections you just can\'t ignore"'
  };

  const transNote = wt ? '\nTRANSLATION: For every copy field, add a "_zh" key with natural Simplified Chinese translation. No character limit for translations.' : '';

  return `You are a senior performance marketing copywriter, 10+ years writing ads for Tinder, Hinge, Bumble, Match. You write copy that stops scrolls and drives installs.

PRODUCT: ${name}
SELLING POINTS: ${pts}
AUDIENCE: ${aud}
TONE: ${toneMap[S.tone]}
LANGUAGE: ${langMap[S.lang].inst}
STYLE REF: ${toneEx[S.tone]||''}
${transNote}
${batchNote}

CHARACTER LIMITS — ABSOLUTE #1 PRIORITY:
- HARD limits. Every space, punctuation mark, emoji counts as a character.
- Google headlines: 30 chars MAX = roughly 4 short words. Count carefully.
- Never exceed any limit. Trim before outputting.
- Multi-variant fields: each MUST use a meaningfully different angle, hook style, or emotional trigger.

WRITING RULES:
- Human voice. Contractions, "you", raw emotion. Never corporate.
- Speak to desires: connection, tired of bad dates, loneliness, thrill of attraction.
- Meta: emotional hook + curiosity gap. Google: clear benefit, search-intent. TikTok: raw casual Gen Z energy.
- BANNED: "find love", "meet your match", "join today", "soulmate", "perfect match", "start your journey".
- Make the reader feel SEEN, not sold to.

OUTPUT: Valid JSON ONLY. No markdown. No backticks. Nothing before or after the JSON.

{
${active.map(p => specs[p]).join(',\n')}
}

PLATFORMS: ${active.join(', ')}
FINAL CHECK: Recount every non-zh field. Trim if over limit. Output.`;
}

// ── CHAR LIMIT ENFORCER ──
function enforceCharLimits(parsed) {
  const lim = {
    meta:   {headline1:40,headline2:40,headline3:40,primary_text1:125,primary_text2:125,primary_text3:125,cta:20},
    google: {headline1:30,headline2:30,headline3:30,headline4:30,headline5:30,description1:90,description2:90,description3:90,description4:90,description5:90},
    tiktok: {hook1:50,hook2:50,hook3:50,ad_text1:100,ad_text2:100,ad_text3:100,cta:20,hashtags:80}
  };
  for (const [p, fields] of Object.entries(lim)) {
    if (!parsed[p]) continue;
    for (const [f, l] of Object.entries(fields)) {
      if (parsed[p][f] && parsed[p][f].length > l)
        parsed[p][f] = parsed[p][f].substring(0, l).trimEnd();
    }
  }
  return parsed;
}

// ── MAIN GENERATE ──
async function gen() {
  const active = Object.entries(S.plt).filter(([,v])=>v).map(([k])=>k);
  if (!active.length) { alert('请至少选择一个投放平台'); return; }

  batchCount++; // increment batch — forces different output each time

  const btn = document.getElementById('gbtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> 生成中...';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('rarea').style.display = 'block';
  document.getElementById('lbadge').textContent = langMap[S.lang].name;
  document.getElementById('batch-badge').textContent = `第 ${batchCount} 批`;

  const grid = document.getElementById('rgrid');
  grid.innerHTML = '<div class="lcards">'+active.map(p =>
    `<div class="lcard"><div class="spin2"></div><div class="ltext">正在生成 ${pFmt[p].name} 文案...</div></div>`
  ).join('')+'</div>';

  const provider = document.getElementById('model-select').value;

  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        provider,
        max_tokens: 3000,
        messages: [
          { role:'system', content:'You are an expert ad copywriter. Always respond with valid JSON only, no markdown, no explanation.' },
          { role:'user',   content: buildPrompt() }
        ]
      })
    });

    if (!resp.ok) {
      const e = await resp.json().catch(()=>({}));
      throw new Error(e.error?.message || `HTTP ${resp.status}`);
    }

    const data  = await resp.json();
    const raw   = (data.content||[]).map(i=>i.text||'').join('');
    const clean = raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const parsed = enforceCharLimits(JSON.parse(clean));
    gdata = parsed;
    grid.innerHTML = '';
    const wt = needsTrans();

    active.forEach(p => {
      const pd = parsed[p]; if (!pd) return;
      const fmt = pFmt[p];
      const card = document.createElement('div');
      card.className = 'pcard';

      const fieldsHtml = fmt.fields.map((f,i) => {
        const val   = (pd[f.k]||'').trim();
        const zhVal = wt ? (pd[f.k+'_zh']||'').trim() : '';
        const len   = val.length;
        const over  = len > f.lim;
        const transHtml = (wt && zhVal) ? `
          <div class="trans-block">
            <div class="trans-label">中文翻译</div>
            <div class="trans-text">${zhVal}</div>
          </div>` : '';
        const copyTransBtn = (wt && zhVal)
          ? `<button class="cbtn" onclick="copyText(this,'${zhVal.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">⎘ 译文</button>` : '';

        return `${i>0?'<div class="fsep"></div>':''}
          <div class="cfield">
            <div class="frow">
              <span class="fname">${f.l}</span>
              <span class="fcount${over?' fover':''}" id="cc-${p}-${f.k}">${len}/${f.lim}</span>
            </div>
            <div class="fcontent" id="fc-${p}-${f.k}" contenteditable="true"
              oninput="ucc('${p}','${f.k}',${f.lim})">${val}</div>
            ${transHtml}
            <div class="cacts">
              <button class="cbtn" onclick="cfField('${p}','${f.k}',this)">⎘ 复制</button>
              ${copyTransBtn}
            </div>
          </div>`;
      }).join('');

      card.innerHTML = `
        <div class="phead">
          <span class="pdot ${fmt.dc}"></span>
          <span class="pname">${fmt.name}</span>
          <span class="psub">${fmt.fields.length} fields</span>
        </div>
        <div class="fgrid">${fieldsHtml}</div>`;
      grid.appendChild(card);
    });

  } catch(e) {
    grid.innerHTML = `<div class="errbar">⚠️ <strong>生成失败：</strong>${e.message}<br><small style="opacity:.6">请检查 Worker 地址和 API Key 是否正确</small></div>`;
    batchCount--; // rollback on failure
  }

  btn.disabled = false;
  btn.innerHTML = '✦ 重新生成';
}

// ── UTILITIES ──
function ucc(p,k,lim) {
  const el = document.getElementById('fc-'+p+'-'+k);
  const cc = document.getElementById('cc-'+p+'-'+k);
  const len = (el.textContent||'').length;
  cc.textContent = len+'/'+lim;
  cc.className = 'fcount'+(len>lim?' fover':'');
}
function cfField(p,k,btn) {
  const text = (document.getElementById('fc-'+p+'-'+k).textContent||'').trim();
  copyText(btn, text);
}
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(()=>{
    const o = btn.innerHTML;
    btn.innerHTML = '✓'; btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML=o; btn.classList.remove('copied'); }, 1500);
  });
}
function copyAll() {
  const active = Object.entries(S.plt).filter(([,v])=>v).map(([k])=>k);
  const wt = needsTrans();
  let out = '';
  active.forEach(p => {
    if (!gdata[p]) return;
    out += '\n=== '+pFmt[p].name+' ===\n';
    pFmt[p].fields.forEach(f => {
      const el  = document.getElementById('fc-'+p+'-'+f.k);
      const val = el ? el.textContent.trim() : (gdata[p][f.k]||'');
      out += f.l+': '+val+'\n';
      if (wt && gdata[p][f.k+'_zh']) out += f.l+' [中文]: '+gdata[p][f.k+'_zh']+'\n';
    });
  });
  navigator.clipboard.writeText(out.trim()).then(()=>{
    const b = document.querySelector('.cabtn');
    b.textContent = '✓ 已全部复制';
    setTimeout(()=>{ b.textContent='⎘ 复制全部'; }, 2000);
  });
}
</script>
